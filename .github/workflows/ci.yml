name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (typecheck, test, demos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit + integration tests
        run: npm test
      - name: Smoke-run offline demos
        run: |
          npm run demo:werewolf
          npm run demo:aquarium
          npm run demo:solve
          npm run demo:god
          npm run demo:concurrency

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # npm install (not ci): Vite 8/rolldown pulls platform-specific wasm
      # bindings whose transitive optional deps a macOS-generated lock file
      # can't fully pin for a Linux runner, which trips the stricter `npm ci`.
      - run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
